name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history: the tool reads git log
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Show failures on the run page
        if: failure()
        shell: bash
        run: |
          body=$(tail -40 test-output.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=test output::$body"
      - run: python demo.py
      - name: Analyse this repository
        run: |
          pip install -q .
          codetax .
